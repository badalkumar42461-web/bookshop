<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Forgot Password | PageTurner Bookstore</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="logo">Page<span>Turner</span> <small style="font-size:12px;color:var(--muted)">Admin</small></a>
  </div>
</nav>

<div class="form-page">
  <h2>Admin Password Reset</h2>
  <p class="subtitle">Enter your admin email to receive a reset link.</p>
  <div id="adminForgotAlert"></div>
  <form id="adminForgotForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required />
    </div>
    <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
  </form>
  <div class="form-footer">
    <a href="admin-login.html">Back to Admin Login</a>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin-auth.js"></script>
</body>
</html>
