<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Cart | PageTurner Bookstore</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="logo">Page<span>Turner</span></a>
    <div class="nav-links" id="navAuthArea"></div>
  </div>
</nav>

<section class="container">
  <h2 class="section-title" style="text-align:left">Your Shopping Cart</h2>
  <div id="cartAlert"></div>
  <div class="cart-layout">
    <div id="cartItemsWrap"><p>Loading cart...</p></div>
    <div class="cart-summary">
      <h3 style="margin-bottom:16px;">Order Summary</h3>
      <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">₹0.00</span></div>
      <div class="summary-row total"><span>Total</span><span id="sumTotal">₹0.00</span></div>
      <button class="btn btn-primary btn-block mt-16" id="checkoutBtn">Proceed to Checkout</button>
    </div>
  </div>
</section>

<footer>
  <div class="container"><p>&copy; 2026 PageTurner Bookstore. All rights reserved.</p></div>
</footer>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
