<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Reset Password | PageTurner Bookstore</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="logo">Page<span>Turner</span> <small style="font-size:12px;color:var(--muted)">Admin</small></a>
  </div>
</nav>

<div class="form-page">
  <h2>Reset Admin Password</h2>
  <p class="subtitle">Choose a new password for your admin account.</p>
  <div id="adminResetAlert"></div>
  <form id="adminResetForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required />
    </div>
    <div class="form-group">
      <label>Reset Token</label>
      <input type="text" id="token" required />
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPassword" minlength="6" required />
    </div>
    <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
  </form>
  <div class="form-footer">
    <a href="admin-login.html">Back to Admin Login</a>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin-auth.js"></script>
</body>
</html>
