<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password | PageTurner Bookstore</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="logo">Page<span>Turner</span></a>
  </div>
</nav>

<div class="form-page">
  <h2>Reset Password</h2>
  <p class="subtitle">Choose a new password for your account.</p>
  <div id="resetAlert"></div>
  <form id="resetForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" required />
    </div>
    <div class="form-group">
      <label>Reset Token</label>
      <input type="text" id="token" required />
      <small style="color:var(--muted)">Auto-filled from your reset link, or paste it from the email.</small>
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPassword" minlength="6" required />
    </div>
    <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
  </form>
  <div class="form-footer">
    <a href="login.html">Back to Login</a>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
